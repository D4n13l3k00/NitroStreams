name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun ci

      - name: Check
        run: bun run check

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          bun -e '
            const { version } = await Bun.file("package.json").json();
            const expectedTag = `v${version}`;
            const actualTag = process.env.GITHUB_REF_NAME;
            if (actualTag !== expectedTag) {
              console.error(`::error::Release tag ${actualTag} does not match package.json version (expected ${expectedTag}).`);
              process.exit(1);
            }
            console.log(`Release tag verified: ${actualTag}`);
          '

  release:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun run build

      - name: Upload plugin to the release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          file: dist/NitroStreams.plugin.js
          tag: ${{ github.ref }}
          overwrite: true
